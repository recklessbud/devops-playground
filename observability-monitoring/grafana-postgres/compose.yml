name: ${PROJECT_NAME}


services:
  grafana:
    restart: always
    image: grafana/grafana:latest
    container_name: ${GRAFANA_CONTAINER_NAME}
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      # - grafana-data:/var/lib/grafana
    depends_on:
      database:
          condition: service_healthy
    networks:
      - monitoring
  
  database:
    restart: always
    image: postgres:17.5-alpine3.22
    container_name: ${POSTGRES_CONTAINER_NAME}
    env_file:
      - .env
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROMETHEUS_CONTAINER_NAME}
    env_file:
      - .env
    ports:
      - 9090:9090
    volumes:
      - ./prom-configs/prometheus-config.yml:/etc/prometheus/prometheus.yml
      - ./prom-configs/target.json:/etc/prometheus/target.json
    command:
      - '--storage.tsdb.path=/prometheus'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1d'
    restart: always
    networks:
      - monitoring

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres_exporter
    restart: always
    env_file:
      - .env
    environment:
      DATA_SOURCE_NAME: "postgresql://user40:pcPass@${POSTGRES_CONTAINER_NAME}:5432/my_db?sslmode=disable"
    ports:
      - 9187:9187
    depends_on:
      - database
      - prometheus
    networks:
      - monitoring


volumes:
  postgres-data:

networks:
  monitoring:
    driver: bridge